<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Весела фізкультхвилинка з Ведмедиком 🐻</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts for friendly rounded typography -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .font-comfortaa {
      font-family: 'Comfortaa', cursive;
    }

    /* CSS Animations for Bear States */
    @keyframes idle-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    @keyframes bunny-jump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(15px) scale(1.15, 0.85); }
      60% { transform: translateY(-70px) scale(0.9, 1.1); }
      75% { transform: translateY(-80px) rotate(5deg) scale(0.95, 1.05); }
    }

    @keyframes windmill-spin {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-25deg); }
      75% { transform: rotate(25deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes sun-stretch {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05, 1.25); }
    }

    /* Ear and Arm animations per state */
    .state-idle { animation: idle-bounce 2.5s infinite ease-in-out; }
    
    .state-bunny { animation: bunny-jump 0.75s infinite ease-in-out; }
    
    .state-windmill { animation: windmill-spin 1.2s infinite ease-in-out; }
    .state-windmill .bear-arm-left { transform: rotate(140deg); transform-origin: 85px 140px; transition: 0.3s; }
    .state-windmill .bear-arm-right { transform: rotate(-140deg); transform-origin: 215px 140px; transition: 0.3s; }

    .state-stretch { animation: sun-stretch 1.8s infinite ease-in-out; }
    .state-stretch .bear-arm-left { transform: rotate(165deg); transform-origin: 85px 140px; transition: 0.3s; }
    .state-stretch .bear-arm-right { transform: rotate(-165deg); transform-origin: 215px 140px; transition: 0.3s; }

    .bunny-ears { display: none; }
    .state-bunny .bunny-ears { display: block; }
    .state-bunny .bear-ears { display: none; }

    /* Sun rays spinning animation */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }

    /* Pulse effects */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 221, 87, 0.6); }
      50% { box-shadow: 0 0 35px rgba(255, 221, 87, 1); }
    }
    .pulse-btn {
      animation: pulse-glow 2s infinite;
    }

    /* Floating particles background */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(2px);
      pointer-events: none;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 overflow-x-hidden relative">

  <!-- Background decorative floating bubbles -->
  <div id="bubbles-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <!-- Top Header / Control Bar -->
  <header class="w-full max-w-2xl flex items-center justify-between z-10 bg-white/60 backdrop-blur-md p-4 rounded-3xl shadow-lg border border-white/50 mb-2">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-400 text-white p-3 rounded-2xl shadow-md text-2xl">
        <i class="fa-solid fa-child-reaching"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-bold font-comfortaa text-emerald-800 leading-tight">Весела Фізкультхвилинка</h1>
        <p class="text-xs sm:text-sm text-emerald-600 font-semibold">Порухайся разом із Ведмедиком!</p>
      </div>
    </div>
    
    <!-- Audio Mute Toggle Button -->
    <button id="soundToggleBtn" onclick="toggleAudio()" class="bg-white hover:bg-emerald-50 text-emerald-700 px-4 py-2 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2 border border-emerald-200 active:scale-95">
      <i id="soundIcon" class="fa-solid fa-volume-high text-emerald-500 text-lg"></i>
      <span id="soundText" class="hidden sm:inline">Звук увімк.</span>
    </button>
  </header>

  <!-- Main Game Stage -->
  <main class="w-full max-w-2xl flex flex-col items-center justify-center z-10 my-auto">
    
    <!-- Encouragement Banner / Speech Bubble -->
    <div class="w-full mb-3 text-center px-4">
      <div id="speechBubble" class="inline-block bg-white text-emerald-900 text-base sm:text-xl font-bold px-6 py-3 rounded-3xl shadow-xl border-4 border-amber-300 relative transform transition-all duration-300 scale-100">
        <span id="speechText">Привіт! Обирай вправу та почнемо розминку! 🤸‍♂️</span>
      </div>
    </div>

    <!-- Character & Timer Container -->
    <div class="relative w-full max-w-md aspect-square flex items-center justify-center my-2">
      
      <!-- Background Sun Rays Effect for High Energy -->
      <div id="sunRays" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-500 pointer-events-none">
        <svg class="w-full h-full animate-spin-slow text-amber-300/40" viewBox="0 0 100 100">
          <g fill="currentColor">
            <path d="M50 0 L55 35 L45 35 Z"/>
            <path d="M50 100 L55 65 L45 65 Z"/>
            <path d="M0 50 L35 55 L35 45 Z"/>
            <path d="M100 50 L65 55 L65 45 Z"/>
            <path d="M14.6 14.6 L41 37 L37 41 Z"/>
            <path d="M85.4 85.4 L59 63 L63 59 Z"/>
            <path d="M14.6 85.4 L37 59 L41 63 Z"/>
            <path d="M85.4 14.6 L63 41 L59 37 Z"/>
          </g>
        </svg>
      </div>

      <!-- Animated SVG Bear Character -->
      <div id="characterWrapper" class="state-idle relative z-10 w-64 h-64 sm:w-80 sm:h-80 transition-all duration-300 flex items-center justify-center">
        <svg id="bearSvg" viewBox="0 0 300 300" class="w-full h-full drop-shadow-2xl">
          <!-- Shadow -->
          <ellipse cx="150" cy="275" rx="75" ry="12" fill="rgba(0,0,0,0.15)" />

          <!-- Bunny Ears (Visible only in Bunny Jump Mode) -->
          <g class="bunny-ears">
            <path d="M 105 90 Q 75 -20 100 -30 Q 125 -20 115 90 Z" fill="#FFB74D" stroke="#E65100" stroke-width="4"/>
            <path d="M 107 80 Q 85 -10 100 -20 Q 115 -10 112 80 Z" fill="#FFD54F"/>
            
            <path d="M 195 90 Q 225 -20 200 -30 Q 175 -20 185 90 Z" fill="#FFB74D" stroke="#E65100" stroke-width="4"/>
            <path d="M 193 80 Q 215 -10 200 -20 Q 185 -10 188 80 Z" fill="#FFD54F"/>
          </g>

          <!-- Bear Ears (Default) -->
          <g class="bear-ears">
            <circle cx="95" cy="85" r="30" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
            <circle cx="95" cy="85" r="18" fill="#FFCC80"/>
            <circle cx="205" cy="85" r="30" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
            <circle cx="205" cy="85" r="18" fill="#FFCC80"/>
          </g>

          <!-- Legs -->
          <ellipse cx="110" cy="245" rx="22" ry="30" fill="#795548" stroke="#4E342E" stroke-width="4"/>
          <ellipse cx="190" cy="245" rx="22" ry="30" fill="#795548" stroke="#4E342E" stroke-width="4"/>
          <!-- Feet pads -->
          <ellipse cx="110" cy="255" rx="12" ry="15" fill="#FFCC80"/>
          <ellipse cx="190" cy="255" rx="12" ry="15" fill="#FFCC80"/>

          <!-- Body -->
          <ellipse cx="150" cy="190" rx="70" ry="75" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
          <!-- Tummy -->
          <ellipse cx="150" cy="195" rx="48" ry="52" fill="#FFE0B2"/>

          <!-- Left Arm -->
          <g class="bear-arm-left" style="transition: transform 0.3s ease;">
            <rect x="55" y="140" width="35" height="75" rx="17.5" fill="#8D6E63" stroke="#4E342E" stroke-width="4" transform="rotate(20 72.5 140)"/>
            <circle cx="60" cy="205" r="14" fill="#FFCC80"/>
          </g>

          <!-- Right Arm -->
          <g class="bear-arm-right" style="transition: transform 0.3s ease;">
            <rect x="210" y="140" width="35" height="75" rx="17.5" fill="#8D6E63" stroke="#4E342E" stroke-width="4" transform="rotate(-20 227.5 140)"/>
            <circle cx="240" cy="205" r="14" fill="#FFCC80"/>
          </g>

          <!-- Head -->
          <circle cx="150" cy="120" r="60" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>

          <!-- Snout -->
          <ellipse cx="150" cy="132" rx="28" ry="22" fill="#FFE0B2" stroke="#4E342E" stroke-width="3"/>
          <!-- Nose -->
          <path d="M 140 120 Q 150 112 160 120 Q 150 135 140 120 Z" fill="#3E2723"/>
          <!-- Mouth -->
          <path id="bearMouth" d="M 142 135 Q 150 144 158 135" fill="none" stroke="#3E2723" stroke-width="3" stroke-linecap="round"/>

          <!-- Eyes -->
          <g id="bearEyes">
            <circle cx="128" cy="108" r="7" fill="#3E2723"/>
            <circle cx="172" cy="108" r="7" fill="#3E2723"/>
            <!-- Eye Highlights -->
            <circle cx="126" cy="106" r="2.5" fill="#FFFFFF"/>
            <circle cx="170" cy="106" r="2.5" fill="#FFFFFF"/>
          </g>

          <!-- Cheeks -->
          <circle cx="112" cy="125" r="10" fill="#FF8A80" opacity="0.6"/>
          <circle cx="188" cy="125" r="10" fill="#FF8A80" opacity="0.6"/>
        </svg>
      </div>

      <!-- Circular Countdown Timer (Overlaid around character) -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
          <!-- Outer Track Ring -->
          <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6"/>
          <!-- Animated Progress Ring -->
          <circle id="timerProgress" cx="50" cy="50" r="46" fill="none" stroke="#FF5722" stroke-width="6" 
                  stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000 ease-linear"/>
        </svg>
      </div>

      <!-- Digital Timer Badge -->
      <div id="timerBadge" class="absolute top-2 right-2 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-black text-2xl sm:text-3xl px-4 py-2 rounded-2xl shadow-xl border-2 border-white flex items-center gap-2 transform transition-transform scale-100">
        <i class="fa-solid fa-stopwatch animate-bounce"></i>
        <span id="timerText">20</span>с
      </div>
    </div>

  </main>

  <!-- Exercise Control Panel / Buttons -->
  <footer class="w-full max-w-2xl z-10 mt-auto">
    <div id="buttonGroup" class="grid grid-cols-1 sm:grid-cols-3 gap-3 p-2">
      
      <!-- Exercise 1: Bunny Jump -->
      <button onclick="startExercise('bunny')" class="exercise-btn group relative bg-gradient-to-b from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 text-white rounded-3xl p-4 shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 active:translate-y-0 text-center flex flex-col items-center justify-center border-b-4 border-rose-700">
        <div class="text-4xl mb-1 group-hover:scale-125 transition-transform">🐰</div>
        <div class="font-bold text-lg leading-tight">Пострибай</div>
        <div class="text-xs text-pink-100 font-medium">як зайчик</div>
      </button>

      <!-- Exercise 2: Windmill -->
      <button onclick="startExercise('windmill')" class="exercise-btn group relative bg-gradient-to-b from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white rounded-3xl p-4 shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 active:translate-y-0 text-center flex flex-col items-center justify-center border-b-4 border-blue-700">
        <div class="text-4xl mb-1 group-hover:scale-125 group-hover:rotate-45 transition-transform">🌀</div>
        <div class="font-bold text-lg leading-tight">Покрутися</div>
        <div class="text-xs text-sky-100 font-medium">як млин</div>
      </button>

      <!-- Exercise 3: Sun Stretch -->
      <button onclick="startExercise('stretch')" class="exercise-btn group relative bg-gradient-to-b from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white rounded-3xl p-4 shadow-lg hover:shadow-2xl transition-all duration-200 transform hover:-translate-y-1 active:translate-y-0 text-center flex flex-col items-center justify-center border-b-4 border-orange-700">
        <div class="text-4xl mb-1 group-hover:scale-125 transition-transform">☀️</div>
        <div class="font-bold text-lg leading-tight">Потягнися</div>
        <div class="text-xs text-amber-100 font-medium">до сонечка</div>
      </button>

    </div>

    <!-- Stop / Reset Button (Hidden by default during idle) -->
    <div id="stopContainer" class="hidden text-center mt-2">
      <button onclick="resetWorkout()" class="bg-gray-700 hover:bg-gray-800 text-white px-6 py-2 rounded-full font-bold text-sm shadow-md transition-all active:scale-95 inline-flex items-center gap-2">
        <i class="fa-solid fa-square"></i> Зупинити вправу
      </button>
    </div>
  </footer>

  <!-- Canvas Overlay for Fireworks & Confetti -->
  <canvas id="fireworksCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- JavaScript Logic -->
  <script>
    /* ===================================================================
       GLOBAL STATE & CONFIGURATION
       =================================================================== */
    const DURATION = 20; // Exercise duration in seconds
    let timeLeft = DURATION;
    let timerInterval = null;
    let currentExercise = null;
    let isAudioMuted = false;

    // Encourage messages database in Ukrainian
    const ENCOURAGEMENTS = {
      bunny: [
        "Вище стриб-скок! 🐰",
        "Молодець! Як справжній зайчик! 🌾",
        "Ще трішки! Стрибаємо веселіше! ✨",
        "Ніжки працюють пружинисто! 💥",
        "Чудово! Стриб-скок, стриб-скок! 🐾"
      ],
      windmill: [
        "Крутимо ручками вправно! 🌀",
        "Млин меле борошно! Вух-вух! 🌾",
        "Розправляй крила-ручки! 💨",
        "Чудовий темп! Обертаємося! 💫",
        "Ловимо вітерець! Супер! 🍃"
      ],
      stretch: [
        "Тягнемося вище й вище! ☀️",
        "Доторкнися до хмаринки! ☁️",
        "Ручки вгору, ростемо великі! 🌳",
        "Потягнулися на носочках! 🌟",
        "Сонечко дарує нам тепло! ✨"
      ]
    };

    /* ===================================================================
       WEB AUDIO API SYNTHESIZER (No External Sound Files Needed)
       =================================================================== */
    let audioCtx = null;
    let musicInterval = null;
    let musicStep = 0;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.1) {
      if (isAudioMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { console.error(e); }
    }

    // Upbeat Synthesized Background Music Loop
    function startBgMusic() {
      stopBgMusic();
      if (isAudioMuted) return;
      initAudio();

      const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 440.00, 349.23]; // C4, E4, G4, C5 tune
      musicStep = 0;

      musicInterval = setInterval(() => {
        if (isAudioMuted) return;
        const note = notes[musicStep % notes.length];
        
        // Melodic note
        playTone(note, 0.2, 'triangle', 0.08);
        
        // Rhythmic bass tick
        if (musicStep % 2 === 0) {
          playTone(130.81, 0.1, 'sine', 0.12); // C3 Bass
        }
        
        musicStep++;
      }, 250); // Fast upbeat tempo
    }

    function stopBgMusic() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
    }

    // Celebratory Victory Fanfare Sound Effect
    function playVictorySound() {
      if (isAudioMuted) return;
      initAudio();

      const fanfare = [
        { f: 523.25, d: 0.15 }, // C5
        { f: 659.25, d: 0.15 }, // E5
        { f: 783.99, d: 0.15 }, // G5
        { f: 1046.50, d: 0.4 }  // C6
      ];

      fanfare.forEach((note, index) => {
        setTimeout(() => {
          playTone(note.f, note.d, 'square', 0.15);
        }, index * 160);
      });
    }

    // Click UI Sound
    function playClickSound() {
      playTone(600, 0.08, 'sine', 0.1);
    }

    function toggleAudio() {
      isAudioMuted = !isAudioMuted;
      const soundIcon = document.getElementById('soundIcon');
      const soundText = document.getElementById('soundText');

      if (isAudioMuted) {
        soundIcon.className = "fa-solid fa-volume-xmark text-gray-400 text-lg";
        soundText.textContent = "Без звуку";
        stopBgMusic();
      } else {
        soundIcon.className = "fa-solid fa-volume-high text-emerald-500 text-lg";
        soundText.textContent = "Звук увімк.";
        if (currentExercise) startBgMusic();
      }
    }

    /* ===================================================================
       EXERCISE & TIMER LOGIC
       =================================================================== */
    const speechBubble = document.getElementById('speechBubble');
    const speechText = document.getElementById('speechText');
    const characterWrapper = document.getElementById('characterWrapper');
    const timerProgress = document.getElementById('timerProgress');
    const timerText = document.getElementById('timerText');
    const sunRays = document.getElementById('sunRays');
    const stopContainer = document.getElementById('stopContainer');
    const bearMouth = document.getElementById('bearMouth');

    // Circle circumference for 46 radius = ~289
    const CIRCUMFERENCE = 289;

    function updateTimerUI(seconds) {
      timerText.textContent = seconds;
      const offset = CIRCUMFERENCE - (seconds / DURATION) * CIRCUMFERENCE;
      timerProgress.style.strokeDashoffset = offset;

      // Color transition on timer
      if (seconds <= 5) {
        timerProgress.style.stroke = "#e11d48"; // Red warning
      } else if (seconds <= 10) {
        timerProgress.style.stroke = "#f59e0b"; // Amber warning
      } else {
        timerProgress.style.stroke = "#10b981"; // Vibrant Green
      }
    }

    function startExercise(type) {
      initAudio();
      playClickSound();

      // Reset previous state
      clearInterval(timerInterval);
      currentExercise = type;
      timeLeft = DURATION;

      // UI state updates
      stopContainer.classList.remove('hidden');
      sunRays.classList.remove('opacity-0');
      sunRays.classList.add('opacity-100');
      
      // Update Bear Animation Class
      characterWrapper.className = `relative z-10 w-64 h-64 sm:w-80 sm:h-80 transition-all duration-300 flex items-center justify-center state-${type}`;
      
      // Happy Open Mouth SVG
      bearMouth.setAttribute('d', 'M 140 132 Q 150 152 160 132 Z');
      bearMouth.setAttribute('fill', '#E53935');

      // Set initial text & timer
      updateSpeech(getRandomEncouragement(type));
      updateTimerUI(timeLeft);

      // Start Background Workout Music
      startBgMusic();

      // Start Countdown Interval
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI(timeLeft);

        // Periodically update speech bubble encouragement every 4 seconds
        if (timeLeft % 4 === 0 && timeLeft > 0) {
          updateSpeech(getRandomEncouragement(type));
        }

        // Finish exercise
        if (timeLeft <= 0) {
          completeExercise();
        }
      }, 1000);
    }

    function getRandomEncouragement(type) {
      const list = ENCOURAGEMENTS[type];
      return list[Math.floor(Math.random() * list.length)];
    }

    function updateSpeech(text) {
      speechBubble.classList.add('scale-95', 'opacity-80');
      setTimeout(() => {
        speechText.textContent = text;
        speechBubble.classList.remove('scale-95', 'opacity-80');
      }, 150);
    }

    function completeExercise() {
      clearInterval(timerInterval);
      stopBgMusic();
      currentExercise = null;

      // Victory Bear State
      characterWrapper.className = 'relative z-10 w-64 h-64 sm:w-80 sm:h-80 transition-all duration-300 flex items-center justify-center state-idle';
      sunRays.classList.add('opacity-0');
      sunRays.classList.remove('opacity-100');
      stopContainer.classList.add('hidden');

      // Update Speech to Congratulations
      updateSpeech("Ура! Ти справжній супергерой! 🎉 Вправу виконано!");
      playVictorySound();

      // Launch Canvas Fireworks / Confetti
      launchFireworks();
    }

    function resetWorkout() {
      playClickSound();
      clearInterval(timerInterval);
      stopBgMusic();
      currentExercise = null;
      timeLeft = DURATION;

      updateTimerUI(DURATION);
      characterWrapper.className = 'relative z-10 w-64 h-64 sm:w-80 sm:h-80 transition-all duration-300 flex items-center justify-center state-idle';
      bearMouth.setAttribute('d', 'M 142 135 Q 150 144 158 135');
      bearMouth.setAttribute('fill', 'none');
      
      sunRays.classList.add('opacity-0');
      stopContainer.classList.add('hidden');
      updateSpeech("Відпочили? Обирай наступну вправу! 💪");
    }

    /* ===================================================================
       CANVAS FIREWORKS & CONFETTI SYSTEM
       =================================================================== */
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 6 + 4;
        this.velocity = {
          x: (Math.random() - 0.5) * 12,
          y: (Math.random() - 0.5) * 12 - 4
        };
        this.gravity = 0.15;
        this.opacity = 1;
        this.decay = Math.random() * 0.02 + 0.015;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.opacity -= this.decay;
      }
    }

    function launchFireworks() {
      particles = [];
      const colors = ['#FF5722', '#FFEB3B', '#4CAF50', '#00BCD4', '#E91E63', '#9C27B0'];
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Spawn burst of 120 colorful particles
      for (let i = 0; i < 120; i++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push(new Particle(centerX, centerY - 50, color));
      }

      animateFireworks();
    }

    let animationFrameId = null;
    function animateFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach((particle, index) => {
        if (particle.opacity > 0) {
          particle.update();
          particle.draw();
        } else {
          particles.splice(index, 1);
        }
      });

      if (particles.length > 0) {
        animationFrameId = requestAnimationFrame(animateFireworks);
      } else {
        cancelAnimationFrame(animationFrameId);
      }
    }

    /* ===================================================================
       BACKGROUND FLOATING BUBBLES GENERATOR
       =================================================================== */
    function createFloatingBubbles() {
      const container = document.getElementById('bubbles-container');
      const count = 15;

      for (let i = 0; i < count; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bg-bubble';
        const size = Math.random() * 40 + 20;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${Math.random() * 100}%`;
        bubble.style.animationDuration = `${Math.random() * 6 + 6}s`;
        bubble.style.animationDelay = `${Math.random() * 4}s`;
        container.appendChild(bubble);
      }
    }

    // Initialize environment on window load
    window.onload = function() {
      createFloatingBubbles();
      updateTimerUI(DURATION);
    };
  </script>
</body>
